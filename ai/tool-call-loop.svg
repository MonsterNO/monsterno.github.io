<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="LangChain 工具调用循环">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="429" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="48" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#111827">工具调用循环：模型提要求，运行时执行，结果回填</text>

  <!-- 模型 -->
  <rect x="35" y="88" width="240" height="110" rx="10" fill="#f8fafc" stroke="#d8dee4"/>
  <text x="51" y="118" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#2496ed">模型（LLM）</text>
  <text x="51" y="146" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#4b5563">输出 AIMessage</text>
  <text x="51" y="170" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#4b5563">里面带 tool_calls</text>

  <line x1="277" y1="143" x2="311" y2="143" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 运行时 -->
  <rect x="315" y="88" width="230" height="110" rx="10" fill="#f8fafc" stroke="#d8dee4"/>
  <text x="331" y="118" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#6b7280">Agent 运行时</text>
  <text x="331" y="146" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#4b5563">按 name 找到工具</text>
  <text x="331" y="170" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#4b5563">执行函数、校验参数</text>

  <line x1="547" y1="143" x2="581" y2="143" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ToolMessage -->
  <rect x="585" y="88" width="270" height="110" rx="10" fill="#f8fafc" stroke="#d8dee4"/>
  <text x="601" y="118" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#d97706">ToolMessage</text>
  <text x="601" y="146" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#4b5563">结果 + tool_call_id</text>
  <text x="601" y="170" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#4b5563">追加进消息列表</text>

  <line x1="857" y1="143" x2="891" y2="143" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 再推理 -->
  <rect x="895" y="88" width="285" height="110" rx="10" fill="#f8fafc" stroke="#d8dee4"/>
  <text x="911" y="118" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#16a34a">模型再推理</text>
  <text x="911" y="146" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#4b5563">没有 tool_calls 就收尾</text>
  <text x="911" y="170" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#4b5563">输出最终回答</text>

  <path d="M1037,200 L1037,252 L155,252 L155,204" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="596" y="242" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6b7280">还有 tool_calls 就再来一轮</text>

  <text x="44" y="308" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#374151">create_agent 会自动跑这个循环：你只要把 tools=[...] 传进去，剩下的交给它</text>
  <text x="44" y="336" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#374151">一次回复里可以有多个 tool_calls，运行时会逐个执行，再一起回填</text>
  <text x="44" y="364" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#374151">工具执行失败时，错误同样作为一条 ToolMessage 回给模型，模型可以换个参数重试</text>
</svg>
