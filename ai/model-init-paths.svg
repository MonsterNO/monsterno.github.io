<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="模型初始化的三条路径">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="429" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="46" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#111827">三种初始化，拿到的是同一种 ChatModel</text>

  <!-- 三条路 -->
  <rect x="60" y="75" width="300" height="78" rx="10" fill="#f8fafc" stroke="#d8dee4"/>
  <text x="76" y="104" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700" fill="#2496ed">① 默认初始化</text>
  <text x="76" y="130" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#4b5563">init_chat_model(model="deepseek-…")</text>

  <rect x="420" y="75" width="300" height="78" rx="10" fill="#f8fafc" stroke="#d8dee4"/>
  <text x="436" y="104" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700" fill="#d97706">② 自定义初始化</text>
  <text x="436" y="130" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#4b5563">provider + base_url + api_key</text>

  <rect x="780" y="75" width="320" height="78" rx="10" fill="#f8fafc" stroke="#d8dee4"/>
  <text x="796" y="104" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="700" fill="#16a34a">③ 专用 Model 类</text>
  <text x="796" y="130" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#4b5563">ChatOllama(model="qwen3.5:0.8b")</text>

  <line x1="210" y1="155" x2="404" y2="206" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="155" x2="570" y2="204" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="940" y1="155" x2="736" y2="206" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ChatModel -->
  <rect x="300" y="210" width="560" height="72" rx="10" fill="#f8fafc" stroke="#d8dee4"/>
  <text x="580" y="240" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#111827">ChatModel 对象</text>
  <text x="580" y="264" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#4b5563">消息格式统一，换模型不用改下游代码</text>

  <line x1="450" y1="284" x2="368" y2="326" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="284" x2="832" y2="326" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 两种用法 -->
  <rect x="200" y="330" width="340" height="72" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="370" y="360" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#15803d">create_agent(model=model)</text>
  <text x="370" y="384" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4b5563">要工具、要记忆、要多轮 → 用 Agent</text>

  <rect x="660" y="330" width="340" height="72" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="830" y="360" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#15803d">model.invoke(messages)</text>
  <text x="830" y="384" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#4b5563">只要一次性问答 → 直接用模型</text>
</svg>
