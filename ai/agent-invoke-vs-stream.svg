<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="invoke 与 stream_events 的等待差异">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="429" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="48" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#111827">同一句话，两种等待方式</text>

  <line x1="140" y1="86" x2="1160" y2="86" stroke="#e5e7eb" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="1168" y="90" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#9ca3af">时间</text>

  <!-- invoke -->
  <text x="40" y="142" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#6b7280">invoke</text>
  <text x="40" y="272" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#2496ed">stream_events</text>
  <rect x="140" y="112" width="680" height="56" rx="8" fill="#f1f5f9" stroke="#d8dee4"/>
  <text x="480" y="146" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#6b7280">等待：模型推理 + 工具执行</text>
  <rect x="840" y="112" width="310" height="56" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="995" y="146" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#15803d">整段文本一次性到达</text>
  <text x="150" y="192" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#9ca3af">这段时间里，界面上什么都没有</text>

  <!-- stream_events -->
  <rect x="160" y="237" width="230" height="56" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="275" y="271" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#15803d">片段 1</text>
  <rect x="410" y="237" width="230" height="56" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="525" y="271" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#15803d">片段 2</text>
  <rect x="660" y="237" width="230" height="56" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="775" y="271" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#15803d">片段 3</text>
  <rect x="910" y="237" width="250" height="56" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="1035" y="271" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#15803d">片段 4 …</text>
  <text x="170" y="317" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#9ca3af">首字很早就出现，后面边跑边补</text>

  <text x="44" y="360" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#374151">invoke 适合脚本、后台任务：拿到完整结果再往下处理，最省事</text>
  <text x="44" y="388" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#374151">stream_events 适合聊天界面：用户不用干等，工具调用过程也能一条条展示</text>
</svg>
