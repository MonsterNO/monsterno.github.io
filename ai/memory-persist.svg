<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="记忆持久化存储的结构">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="429" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="50" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#111827">记忆持久化：两个组件，一个数据库</text>

  <!-- Agent -->
  <rect x="30" y="110" width="180" height="90" rx="10" fill="#f8fafc" stroke="#d8dee4"/>
  <text x="46" y="145" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#6b7280">Agent</text>
  <text x="46" y="172" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#4b5563">自身不存数据</text>

  <line x1="212" y1="150" x2="268" y2="120" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="212" y1="160" x2="268" y2="240" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- checkpointer -->
  <rect x="270" y="70" width="340" height="95" rx="10" fill="#f8fafc" stroke="#d8dee4"/>
  <text x="286" y="100" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#2496ed">PostgresSaver</text>
  <text x="286" y="128" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4b5563">会话快照，按 thread_id 区分</text>
  <text x="286" y="150" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4b5563">表：checkpoints 系列</text>

  <!-- store -->
  <rect x="270" y="195" width="340" height="95" rx="10" fill="#f8fafc" stroke="#d8dee4"/>
  <text x="286" y="225" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#d97706">PostgresStore</text>
  <text x="286" y="253" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4b5563">长期记忆，按 namespace 区分</text>
  <text x="286" y="275" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4b5563">表：store</text>

  <line x1="612" y1="118" x2="678" y2="140" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="612" y1="242" x2="678" y2="200" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PG -->
  <rect x="680" y="95" width="250" height="170" rx="10" fill="#f8fafc" stroke="#d8dee4"/>
  <text x="696" y="125" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#16a34a">PostgreSQL</text>
  <text x="696" y="155" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4b5563">checkpoints 系列表</text>
  <text x="696" y="180" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4b5563">store 表</text>
  <text x="696" y="205" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4b5563">数据挂数据卷</text>
  <text x="696" y="230" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4b5563">容器可以随便重建</text>

  <rect x="20" y="300" width="1160" height="110" rx="12" fill="none" stroke="#d8dee4" stroke-dasharray="6 4"/>
  <text x="44" y="331" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#374151">内存版换数据库版，业务代码不用改：基类相同，只换初始化那一行</text>
  <text x="44" y="359" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#374151">setup() 幂等，启动时跑一次即可；跳过它，第一次查询会报 relation does not exist</text>
  <text x="44" y="387" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#374151">连接由上下文管理器管着，with 语句之外再用 agent，会拿到一个已关闭的连接</text>
</svg>
