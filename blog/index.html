</div></div></div></template><template><div class="vp-blog-post-item has-cover right" data-allow-mismatch data-v-0627f155 data-v-372ae5d5><div data-allow-mismatch class="post-cover" style="width:240px;height:180px;" data-v-372ae5d5><img src="/hole-assets/cover/AI代码生成原理深度解析.png" alt="AI代码生成原理深度解析-从Token预测到AST理解" loading="lazy" data-v-372ae5d5></div><div class="blog-post-item-content" data-v-372ae5d5><h3 data-v-372ae5d5><!----><!----><a class="vp-link no-icon link" href="/blog/2zibdq9t/" data-v-372ae5d5 data-v-bb18f006><!--[-->AI代码生成原理深度解析-从Token预测到AST理解<!--]--><!----></a></h3><div class="post-meta" data-v-372ae5d5><div class="category-list" data-v-372ae5d5><span class="icon vpi-folder" data-v-372ae5d5></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=fa6808" data-v-372ae5d5 data-v-bb18f006><!--[-->技术文章<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-372ae5d5><span class="icon vpi-tag" data-v-372ae5d5></span><!--[--><a class="vp-link no-icon link tag vp-tag-394d" href="/blog/tags/?tag=AI代码生成" data-v-372ae5d5 data-v-bb18f006><!--[-->AI代码生成<!--]--><!----></a><!--]--></div><div class="create-time" data-v-372ae5d5><span class="icon vpi-clock" data-v-372ae5d5></span><span data-v-372ae5d5>2026-09-01</span></div></div><div class="vp-doc excerpt" data-v-372ae5d5><p>AI写代码背后到底发生了什么？本文从最基础的Token概率预测讲起，逐层拆解代码大模型的工作原理——Tokenizer、上下文窗口、注意力机制、Fill-in-the-Middle、AST级理解、推理优化，并解释为什么AI有时候会写出&quot;看起来对但跑不通&quot;的代码。</p>
</div></div></div></template><template><div class="vp-blog-post-item has-cover right" data-allow-mismatch data-v-0627f155 data-v-372ae5d5><div data-allow-mismatch class="post-cover" style="width:240px;height:180px;" data-v-372ae5d5><img src="/hole-assets/cover/Agent工具调用可靠性工程.png" alt="Agent工具调用可靠性工程-从错误恢复到人在回路" loading="lazy" data-v-372ae5d5></div><div class="blog-post-item-content" data-v-372ae5d5><h3 data-v-372ae5d5><!----><!----><a class="vp-link no-icon link" href="/blog/s895ohjs/" data-v-372ae5d5 data-v-bb18f006><!--[-->Agent工具调用可靠性工程-从错误恢复到人在回路<!--]--><!----></a></h3><div class="post-meta" data-v-372ae5d5><div class="category-list" data-v-372ae5d5><span class="icon vpi-folder" data-v-372ae5d5></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=fa6808" data-v-372ae5d5 data-v-bb18f006><!--[-->技术文章<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-372ae5d5><span class="icon vpi-tag" data-v-372ae5d5></span><!--[--><a class="vp-link no-icon link tag vp-tag-7qu2" href="/blog/tags/?tag=Agent工具调用可靠性工程" data-v-372ae5d5 data-v-bb18f006><!--[-->Agent工具调用可靠性工程<!--]--><!----></a><!--]--></div><div class="create-time" data-v-372ae5d5><span class="icon vpi-clock" data-v-372ae5d5></span><span data-v-372ae5d5>2026-09-01</span></div></div><div class="vp-doc excerpt" data-v-372ae5d5><p>Agent调用工具时出错是常态，不是例外。本文从工程实践角度，系统拆解Agent工具调用的六大失败模式，以及对应的可靠性保障机制——参数校验、重试策略、熔断降级、幂等设计、人在回路、可观测性，并给出可落地的实现方案。</p>
</div></div></div></template><template><div class="vp-blog-post-item has-cover right" data-allow-mismatch data-v-0627f155 data-v-372ae5d5><div data-allow-mismatch class="post-cover" style="width:240px;height:180px;" data-v-372ae5d5><img src="/hole-assets/cover/多Agent通信协议深度对比.png" alt="多Agent通信协议深度对比-A2A-vs-MCP-vs自定义" loading="lazy" data-v-372ae5d5></div><div class="blog-post-item-content" data-v-372ae5d5><h3 data-v-372ae5d5><!----><!----><a class="vp-link no-icon link" href="/blog/8jiwovqx/" data-v-372ae5d5 data-v-bb18f006><!--[-->多Agent通信协议深度对比-A2A-vs-MCP-vs自定义<!--]--><!----></a></h3><div class="post-meta" data-v-372ae5d5><div class="category-list" data-v-372ae5d5><span class="icon vpi-folder" data-v-372ae5d5></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=fa6808" data-v-372ae5d5 data-v-bb18f006><!--[-->技术文章<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-372ae5d5><span class="icon vpi-tag" data-v-372ae5d5></span><!--[--><a class="vp-link no-icon link tag vp-tag-7rqo" href="/blog/tags/?tag=多Agent通信协议深度对比" data-v-372ae5d5 data-v-bb18f006><!--[-->多Agent通信协议深度对比<!--]--><!----></a><!--]--></div><div class="create-time" data-v-372ae5d5><span class="icon vpi-clock" data-v-372ae5d5></span><span data-v-372ae5d5>2026-09-01</span></div></div><div class="vp-doc excerpt" data-v-372ae5d5><p>当多个Agent需要协作时，它们之间怎么通信？本文深度对比目前三种主流方案——Google A2A协议、Anthropic MCP协议、自定义HTTP/gRPC协议，从设计理念、消息模型、安全机制、适用场景四个维度拆解，并给出工程选型建议。</p>
</div></div></div></template><template><div class="vp-blog-post-item has-cover right" data-allow-mismatch data-v-0627f155 data-v-372ae5d5><div data-allow-mismatch class="post-cover" style="width:240px;height:180px;" data-v-372ae5d5><img src="/hole-assets/cover/Agent架构深度解析.png" alt="Agent架构深度解析-从ReAct到Plan-and-Execute" loading="lazy" data-v-372ae5d5></div><div class="blog-post-item-content" data-v-372ae5d5><h3 data-v-372ae5d5><!----><!----><a class="vp-link no-icon link" href="/blog/i9qjuk50/" data-v-372ae5d5 data-v-bb18f006><!--[-->Agent架构深度解析-从ReAct到Plan-and-Execute<!--]--><!----></a></h3><div class="post-meta" data-v-372ae5d5><div class="category-list" data-v-372ae5d5><span class="icon vpi-folder" data-v-372ae5d5></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=fa6808" data-v-372ae5d5 data-v-bb18f006><!--[-->技术文章<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-372ae5d5><span class="icon vpi-tag" data-v-372ae5d5></span><!--[--><a class="vp-link no-icon link tag vp-tag-syvj" href="/blog/tags/?tag=Agent架构深度解析" data-v-372ae5d5 data-v-bb18f006><!--[-->Agent架构深度解析<!--]--><!----></a><!--]--></div><div class="create-time" data-v-372ae5d5><span class="icon vpi-clock" data-v-372ae5d5></span><span data-v-372ae5d5>2026-09-01</span></div></div><div class="vp-doc excerpt" data-v-372ae5d5><p>Agent的核心不是&quot;用了什么模型&quot;，而是&quot;用什么架构组织模型的推理和行动&quot;。本文从最基础的ReAct模式讲起，逐层拆解Reflexion、Tree of Thoughts、Plan-and-Execute等主流Agent架构的原理、适用场景和工程实现细节。</p>
