</div></div></div></template><template><div class="vp-blog-post-item has-cover right" data-allow-mismatch data-v-0627f155 data-v-372ae5d5><div data-allow-mismatch class="post-cover" style="width:240px;height:180px;" data-v-372ae5d5><img src="/hole-assets/cover/AI图像生成原理深度解析.png" alt="AI图像生成原理深度解析-扩散模型从数学到工程" loading="lazy" data-v-372ae5d5></div><div class="blog-post-item-content" data-v-372ae5d5><h3 data-v-372ae5d5><!----><!----><a class="vp-link no-icon link" href="/blog/gdag0x36/" data-v-372ae5d5 data-v-bb18f006><!--[-->AI图像生成原理深度解析-扩散模型从数学到工程<!--]--><!----></a></h3><div class="post-meta" data-v-372ae5d5><div class="category-list" data-v-372ae5d5><span class="icon vpi-folder" data-v-372ae5d5></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=fa6808" data-v-372ae5d5 data-v-bb18f006><!--[-->技术文章<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-372ae5d5><span class="icon vpi-tag" data-v-372ae5d5></span><!--[--><a class="vp-link no-icon link tag vp-tag-k6lc" href="/blog/tags/?tag=AI图像生成原理深度解析" data-v-372ae5d5 data-v-bb18f006><!--[-->AI图像生成原理深度解析<!--]--><!----></a><!--]--></div><div class="create-time" data-v-372ae5d5><span class="icon vpi-clock" data-v-372ae5d5></span><span data-v-372ae5d5>2026-09-01</span></div></div><div class="vp-doc excerpt" data-v-372ae5d5><p>Midjourney、Stable Diffusion、DALL·E背后的核心技术是什么？本文从最基础的概率模型讲起，深度拆解扩散模型（Diffusion Model）的数学原理——前向加噪过程、反向去噪过程、DDPM/DDIM采样器、条件生成（CLIP引导），并讲解工程实现中的关键优化。</p>
</div></div></div></template><template><div class="vp-blog-post-item has-cover right" data-allow-mismatch data-v-0627f155 data-v-372ae5d5><div data-allow-mismatch class="post-cover" style="width:240px;height:180px;" data-v-372ae5d5><img src="/hole-assets/cover/Embedding模型技术演进.png" alt="Embedding模型技术演进-从Word2Vec到多模态向量表示" loading="lazy" data-v-372ae5d5></div><div class="blog-post-item-content" data-v-372ae5d5><h3 data-v-372ae5d5><!----><!----><a class="vp-link no-icon link" href="/blog/q7yb7a6h/" data-v-372ae5d5 data-v-bb18f006><!--[-->Embedding模型技术演进-从Word2Vec到多模态向量表示<!--]--><!----></a></h3><div class="post-meta" data-v-372ae5d5><div class="category-list" data-v-372ae5d5><span class="icon vpi-folder" data-v-372ae5d5></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=fa6808" data-v-372ae5d5 data-v-bb18f006><!--[-->技术文章<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-372ae5d5><span class="icon vpi-tag" data-v-372ae5d5></span><!--[--><a class="vp-link no-icon link tag vp-tag-z4mv" href="/blog/tags/?tag=Embedding模型技术演进" data-v-372ae5d5 data-v-bb18f006><!--[-->Embedding模型技术演进<!--]--><!----></a><!--]--></div><div class="create-time" data-v-372ae5d5><span class="icon vpi-clock" data-v-372ae5d5></span><span data-v-372ae5d5>2026-09-01</span></div></div><div class="vp-doc excerpt" data-v-372ae5d5><p>RAG的效果，一半取决于检索，而检索的效果取决于Embedding模型。本文系统梳理Embedding技术的演进历程——从Word2Vec到BERT，从对比学习到多模态Embedding，讲清每一代技术的原理、优缺点和适用场景，并给出Embedding模型的选型建议。</p>
</div></div></div></template><template><div class="vp-blog-post-item has-cover right" data-allow-mismatch data-v-0627f155 data-v-372ae5d5><div data-allow-mismatch class="post-cover" style="width:240px;height:180px;" data-v-372ae5d5><img src="/hole-assets/cover/向量数据库深度解析.png" alt="向量数据库深度解析-HNSW索引原理与工程实践" loading="lazy" data-v-372ae5d5></div><div class="blog-post-item-content" data-v-372ae5d5><h3 data-v-372ae5d5><!----><!----><a class="vp-link no-icon link" href="/blog/08zyi0uz/" data-v-372ae5d5 data-v-bb18f006><!--[-->向量数据库深度解析-HNSW索引原理与工程实践<!--]--><!----></a></h3><div class="post-meta" data-v-372ae5d5><div class="category-list" data-v-372ae5d5><span class="icon vpi-folder" data-v-372ae5d5></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=fa6808" data-v-372ae5d5 data-v-bb18f006><!--[-->技术文章<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-372ae5d5><span class="icon vpi-tag" data-v-372ae5d5></span><!--[--><a class="vp-link no-icon link tag vp-tag-t6s1" href="/blog/tags/?tag=向量数据库深度解析" data-v-372ae5d5 data-v-bb18f006><!--[-->向量数据库深度解析<!--]--><!----></a><!--]--></div><div class="create-time" data-v-372ae5d5><span class="icon vpi-clock" data-v-372ae5d5></span><span data-v-372ae5d5>2026-09-01</span></div></div><div class="vp-doc excerpt" data-v-372ae5d5><p>RAG是AI应用的核心技术，而向量数据库是RAG的基石。本文从最基础的相似度搜索讲起，深度拆解向量数据库的核心索引算法——HNSW（分层可导航小世界图），讲清它的原理、参数调优、工程实现，并对比主流向量数据库的选型。</p>
</div></div></div></template><template><div class="vp-blog-post-item has-cover right" data-allow-mismatch data-v-0627f155 data-v-372ae5d5><div data-allow-mismatch class="post-cover" style="width:240px;height:180px;" data-v-372ae5d5><img src="/hole-assets/cover/AI网关技术深度解析.png" alt="AI网关技术深度解析-限流熔断模型路由的工程实践" loading="lazy" data-v-372ae5d5></div><div class="blog-post-item-content" data-v-372ae5d5><h3 data-v-372ae5d5><!----><!----><a class="vp-link no-icon link" href="/blog/3mu7ruha/" data-v-372ae5d5 data-v-bb18f006><!--[-->AI网关技术深度解析-限流熔断模型路由的工程实践<!--]--><!----></a></h3><div class="post-meta" data-v-372ae5d5><div class="category-list" data-v-372ae5d5><span class="icon vpi-folder" data-v-372ae5d5></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=fa6808" data-v-372ae5d5 data-v-bb18f006><!--[-->技术文章<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-372ae5d5><span class="icon vpi-tag" data-v-372ae5d5></span><!--[--><a class="vp-link no-icon link tag vp-tag-9i35" href="/blog/tags/?tag=AI网关技术深度解析" data-v-372ae5d5 data-v-bb18f006><!--[-->AI网关技术深度解析<!--]--><!----></a><!--]--></div><div class="create-time" data-v-372ae5d5><span class="icon vpi-clock" data-v-372ae5d5></span><span data-v-372ae5d5>2026-09-01</span></div></div><div class="vp-doc excerpt" data-v-372ae5d5><p>一个生产级的AI应用，为什么需要AI网关？本文系统拆解AI网关的核心功能——模型路由、负载均衡、故障转移、限流熔断、缓存、成本控制、安全防护，并给出可落地的工程实现方案。</p>
</div></div></div></template><template><div class="vp-blog-post-item has-cover right" data-allow-mismatch data-v-0627f155 data-v-372ae5d5><div data-allow-mismatch class="post-cover" style="width:240px;height:180px;" data-v-372ae5d5><img src="/hole-assets/cover/AI应用的可观测性体系.png" alt="AI应用的可观测性体系-Trace-Metric-Log的设计与实现" loading="lazy" data-v-372ae5d5></div><div class="blog-post-item-content" data-v-372ae5d5><h3 data-v-372ae5d5><!----><!----><a class="vp-link no-icon link" href="/blog/a7naqpab/" data-v-372ae5d5 data-v-bb18f006><!--[-->AI应用的可观测性体系-Trace-Metric-Log的设计与实现<!--]--><!----></a></h3><div class="post-meta" data-v-372ae5d5><div class="category-list" data-v-372ae5d5><span class="icon vpi-folder" data-v-372ae5d5></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=fa6808" data-v-372ae5d5 data-v-bb18f006><!--[-->技术文章<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-372ae5d5><span class="icon vpi-tag" data-v-372ae5d5></span><!--[--><a class="vp-link no-icon link tag vp-tag-yj2u" href="/blog/tags/?tag=AI应用的可观测性体系" data-v-372ae5d5 data-v-bb18f006><!--[-->AI应用的可观测性体系<!--]--><!----></a><!--]--></div><div class="create-time" data-v-372ae5d5><span class="icon vpi-clock" data-v-372ae5d5></span><span data-v-372ae5d5>2026-09-01</span></div></div><div class="vp-doc excerpt" data-v-372ae5d5><p>LLM应用出了问题，怎么排查？本文系统拆解AI应用可观测性的三大支柱——Trace（链路追踪）、Metric（指标监控）、Log（日志记录），讲清每个支柱需要采集什么数据、怎么采集、怎么用，并给出可落地的实现方案。</p>
</div></div></div></template><template><div class="vp-blog-post-item has-cover right" data-allow-mismatch data-v-0627f155 data-v-372ae5d5><div data-allow-mismatch class="post-cover" style="width:240px;height:180px;" data-v-372ae5d5><img src="/hole-assets/cover/LLM应用架构设计.png" alt="LLM应用架构设计-从单体到微服务的演进路径" loading="lazy" data-v-372ae5d5></div><div class="blog-post-item-content" data-v-372ae5d5><h3 data-v-372ae5d5><!----><!----><a class="vp-link no-icon link" href="/blog/0nmpwx9s/" data-v-372ae5d5 data-v-bb18f006><!--[-->LLM应用架构设计-从单体到微服务的演进路径<!--]--><!----></a></h3><div class="post-meta" data-v-372ae5d5><div class="category-list" data-v-372ae5d5><span class="icon vpi-folder" data-v-372ae5d5></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=fa6808" data-v-372ae5d5 data-v-bb18f006><!--[-->技术文章<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-372ae5d5><span class="icon vpi-tag" data-v-372ae5d5></span><!--[--><a class="vp-link no-icon link tag vp-tag-adl4" href="/blog/tags/?tag=LLM应用架构设计" data-v-372ae5d5 data-v-bb18f006><!--[-->LLM应用架构设计<!--]--><!----></a><!--]--></div><div class="create-time" data-v-372ae5d5><span class="icon vpi-clock" data-v-372ae5d5></span><span data-v-372ae5d5>2026-09-01</span></div></div><div class="vp-doc excerpt" data-v-372ae5d5><p>一个生产级的LLM应用，后端架构应该怎么设计？本文从最简单的单体架构讲起，逐层拆解LLM应用的核心组件——API网关、模型路由、Prompt管理、RAG引擎、Agent编排、可观测性，并给出从单体到微服务的演进路径和各阶段的技术选型。</p>
</div></div></div></template><template><div class="vp-blog-post-item has-cover right" data-allow-mismatch data-v-0627f155 data-v-372ae5d5><div data-allow-mismatch class="post-cover" style="width:240px;height:180px;" data-v-372ae5d5><img src="/hole-assets/cover/长上下文技术深度解析.png" alt="长上下文技术深度解析-RoPE-ALiBi-YaRN到底在做什么" loading="lazy" data-v-372ae5d5></div><div class="blog-post-item-content" data-v-372ae5d5><h3 data-v-372ae5d5><!----><!----><a class="vp-link no-icon link" href="/blog/josq6x3g/" data-v-372ae5d5 data-v-bb18f006><!--[-->长上下文技术深度解析-RoPE-ALiBi-YaRN到底在做什么<!--]--><!----></a></h3><div class="post-meta" data-v-372ae5d5><div class="category-list" data-v-372ae5d5><span class="icon vpi-folder" data-v-372ae5d5></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=fa6808" data-v-372ae5d5 data-v-bb18f006><!--[-->技术文章<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-372ae5d5><span class="icon vpi-tag" data-v-372ae5d5></span><!--[--><a class="vp-link no-icon link tag vp-tag-bkw4" href="/blog/tags/?tag=长上下文技术深度解析" data-v-372ae5d5 data-v-bb18f006><!--[-->长上下文技术深度解析<!--]--><!----></a><!--]--></div><div class="create-time" data-v-372ae5d5><span class="icon vpi-clock" data-v-372ae5d5></span><span data-v-372ae5d5>2026-09-01</span></div></div><div class="vp-doc excerpt" data-v-372ae5d5><p>大模型的上下文窗口从4K涨到128K再到1M，背后是什么技术在支撑？本文从位置编码的基本原理讲起，深度拆解主流的长上下文技术——RoPE、ALiBi、YaRN、NTK-aware、LongLoRA，解释每种技术的原理、优缺点和适用场景。</p>
</div></div></div></template><template><div class="vp-blog-post-item has-cover right" data-allow-mismatch data-v-0627f155 data-v-372ae5d5><div data-allow-mismatch class="post-cover" style="width:240px;height:180px;" data-v-372ae5d5><img src="/hole-assets/cover/大模型训练全流程拆解.png" alt="大模型训练全流程拆解-预训练SFT-RLHF的技术细节" loading="lazy" data-v-372ae5d5></div><div class="blog-post-item-content" data-v-372ae5d5><h3 data-v-372ae5d5><!----><!----><a class="vp-link no-icon link" href="/blog/mvxdk7vx/" data-v-372ae5d5 data-v-bb18f006><!--[-->大模型训练全流程拆解-预训练SFT-RLHF的技术细节<!--]--><!----></a></h3><div class="post-meta" data-v-372ae5d5><div class="category-list" data-v-372ae5d5><span class="icon vpi-folder" data-v-372ae5d5></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=fa6808" data-v-372ae5d5 data-v-bb18f006><!--[-->技术文章<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-372ae5d5><span class="icon vpi-tag" data-v-372ae5d5></span><!--[--><a class="vp-link no-icon link tag vp-tag-adl4" href="/blog/tags/?tag=大模型训练全流程拆解" data-v-372ae5d5 data-v-bb18f006><!--[-->大模型训练全流程拆解<!--]--><!----></a><!--]--></div><div class="create-time" data-v-372ae5d5><span class="icon vpi-clock" data-v-372ae5d5></span><span data-v-372ae5d5>2026-09-01</span></div></div><div class="vp-doc excerpt" data-v-372ae5d5><p>一个大模型从0到1是怎么训练出来的？本文系统拆解大模型训练的三个阶段——预训练（Pre-training）、监督微调（SFT）、人类反馈强化学习（RLHF），讲清每个阶段的目标、数据、方法和工程挑战。</p>
</div></div></div></template><template><div class="vp-blog-post-item has-cover right" data-allow-mismatch data-v-0627f155 data-v-372ae5d5><div data-allow-mismatch class="post-cover" style="width:240px;height:180px;" data-v-372ae5d5><img src="/hole-assets/cover/Transformer架构深度解析.png" alt="Transformer架构深度解析-从注意力机制到推理优化" loading="lazy" data-v-372ae5d5></div><div class="blog-post-item-content" data-v-372ae5d5><h3 data-v-372ae5d5><!----><!----><a class="vp-link no-icon link" href="/blog/q2hcq4au/" data-v-372ae5d5 data-v-bb18f006><!--[-->Transformer架构深度解析-从注意力机制到推理优化<!--]--><!----></a></h3><div class="post-meta" data-v-372ae5d5><div class="category-list" data-v-372ae5d5><span class="icon vpi-folder" data-v-372ae5d5></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=fa6808" data-v-372ae5d5 data-v-bb18f006><!--[-->技术文章<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-372ae5d5><span class="icon vpi-tag" data-v-372ae5d5></span><!--[--><a class="vp-link no-icon link tag vp-tag-e80f" href="/blog/tags/?tag=Transformer架构深度解析" data-v-372ae5d5 data-v-bb18f006><!--[-->Transformer架构深度解析<!--]--><!----></a><!--]--></div><div class="create-time" data-v-372ae5d5><span class="icon vpi-clock" data-v-372ae5d5></span><span data-v-372ae5d5>2026-09-01</span></div></div><div class="vp-doc excerpt" data-v-372ae5d5><p>Transformer是大模型的基础架构，但大多数人只知道&quot;注意力机制&quot;这个词。本文从最基础的自注意力讲起，逐层拆解Transformer的完整架构——Multi-Head Attention、Feed Forward、Layer Normalization、位置编码、Decoder-only架构，并解释每个组件为什么这样设计。</p>
